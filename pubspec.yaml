name: smartfind
description: "smartFind — Lost Items. Found Faster. A community lost-and-found app for Kyungsung University, built with Flutter, Firebase (Auth + Firestore) and Cloudinary (image hosting)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

# Version ranges are deliberately a little wide: `flutter pub get` then picks
# the newest release that works with the Flutter you have installed. The APIs
# the app uses are identical across the whole range.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase — Authentication, Cloud Firestore and Cloud Messaging (push).
  # (Firebase Storage is NOT used: images live on Cloudinary, which has a free
  # plan and needs no billing account.)
  firebase_core: ">=4.1.0 <6.0.0"
  firebase_auth: ">=6.0.2 <8.0.0"
  cloud_firestore: ">=6.0.1 <8.0.0"
  firebase_messaging: ">=16.0.0 <18.0.0"

  # Pop-up notifications drawn by the app (foreground / no-server mode).
  # 21.x and 22.x have the same API; both need compileSdk 36 + desugaring,
  # which `dart run tool/setup.dart` configures.
  flutter_local_notifications: ">=21.0.0 <23.0.0"

  # Campus VR tour (in-app browser) and "open in browser" fallback.
  webview_flutter: ">=4.10.0 <5.0.0"
  url_launcher: ">=6.3.0 <7.0.0"

  # Map (OpenStreetMap tiles — no API key needed)
  flutter_map: ">=8.3.0 <9.0.0"
  latlong2: ^0.9.1
  geolocator: ">=13.0.1 <15.0.0"

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ">=0.19.0 <1.0.0"
  timeago: ^3.7.0
  share_plus: ">=11.0.0 <14.0.0"
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    # Instrument Sans (SIL OFL 1.1) - the UI typeface. Bundled, so the app
    # never downloads fonts at run time.
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
