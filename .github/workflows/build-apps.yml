# Builds the Android APK and the iOS app in the cloud.
#
# iOS apps can only be compiled on macOS, so this uses GitHub's free macOS
# runners. Setup (once):
#   1. Push this project to a GitHub repository.
#   2. Repository → Settings → Secrets and variables → Actions → New secret
#        Name:  ENV_JSON
#        Value: the full contents of your env.json
#   3. Actions tab → "Build apps" → Run workflow.
#   4. Download the files under "Artifacts" on the finished run.
#
# The iOS result is UNSIGNED (smartFind-ios-unsigned.ipa). To put it on an
# iPhone you need an Apple Developer account: either re-sign it (e.g. with
# Sideloadly / AltStore for testing), or open ios/Runner.xcworkspace on a Mac,
# pick your team under Signing & Capabilities, and run
#   flutter build ipa --release --dart-define-from-file=env.json
# to get an App Store / TestFlight build.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same Flutter as the local builds; newer releases need a newer
          # Android Gradle Plugin than android/settings.gradle.kts declares.
          flutter-version: 3.47.2
          cache: true
      - name: Write env.json
        run: echo '${{ secrets.ENV_JSON }}' > env.json
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: smartFind-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same Flutter as the local builds; newer releases need a newer
          # Android Gradle Plugin than android/settings.gradle.kts declares.
          flutter-version: 3.47.2
          cache: true
      - name: Write env.json
        run: echo '${{ secrets.ENV_JSON }}' > env.json
      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign --dart-define-from-file=env.json
      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr smartFind-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: smartFind-ios
          path: smartFind-ios-unsigned.ipa
